<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="calBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f1438" />
      <stop offset="70%" stop-color="#120c24" />
      <stop offset="100%" stop-color="#0a0614" />
    </radialGradient>

    <!-- Neon Accents -->
    <linearGradient id="calNeonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bb9af7" />
      <stop offset="50%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="#7dcfff" />
    </linearGradient>

    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0.3" />
    </linearGradient>

    <filter id="calGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Capsule -->
  <rect x="32" y="32" width="448" height="448" rx="64" fill="url(#calBgGlow)" stroke="#3b2d54" stroke-width="4" />

  <!-- Outer Cyber Ring / Corner Accents -->
  <rect x="56" y="56" width="400" height="400" rx="48" fill="none" stroke="url(#calNeonGradient)" stroke-width="3" stroke-dasharray="16 8" opacity="0.6" />

  <!-- Calendar Shell Frame -->
  <rect x="96" y="112" width="320" height="288" rx="24" fill="#13141f" stroke="#7aa2f7" stroke-width="4" filter="url(#calGlow)" />

  <!-- Header Bar -->
  <path d="M 96,168 L 416,168" stroke="#bb9af7" stroke-width="3" opacity="0.8" />

  <!-- Top Rings / Binding Clips -->
  <rect x="144" y="92" width="20" height="38" rx="8" fill="#7dcfff" filter="url(#calGlow)" />
  <rect x="246" y="92" width="20" height="38" rx="8" fill="#bb9af7" filter="url(#calGlow)" />
  <rect x="348" y="92" width="20" height="38" rx="8" fill="#7dcfff" filter="url(#calGlow)" />

  <!-- Calendar Grid Lines -->
  <!-- Horizontal Lines -->
  <line x1="116" y1="224" x2="396" y2="224" stroke="#2a2e42" stroke-width="2" />
  <line x1="116" y1="280" x2="396" y2="280" stroke="#2a2e42" stroke-width="2" />
  <line x1="116" y1="336" x2="396" y2="336" stroke="#2a2e42" stroke-width="2" />

  <!-- Vertical Lines -->
  <line x1="172" y1="184" x2="172" y2="376" stroke="#2a2e42" stroke-width="2" />
  <line x1="228" y1="184" x2="228" y2="376" stroke="#2a2e42" stroke-width="2" />
  <line x1="284" y1="184" x2="284" y2="376" stroke="#2a2e42" stroke-width="2" />
  <line x1="340" y1="184" x2="340" y2="376" stroke="#2a2e42" stroke-width="2" />

  <!-- Glowing Active Event Cells (Cyan & Purple Pips) -->
  <circle cx="200" cy="252" r="8" fill="#7dcfff" filter="url(#calGlow)" />
  <circle cx="312" cy="252" r="8" fill="#bb9af7" filter="url(#calGlow)" />
  <circle cx="256" cy="308" r="8" fill="#e0af68" filter="url(#calGlow)" />
  <circle cx="368" cy="364" r="8" fill="#7dcfff" filter="url(#calGlow)" />

  <!-- Center Telemetry Faceted Diamond Rune -->
  <polygon points="256,132 264,142 256,152 248,142" fill="#7dcfff" filter="url(#calGlow)" />
  <polygon points="144,142 148,146 144,150 140,146" fill="#bb9af7" opacity="0.8" />
  <polygon points="368,142 372,146 368,150 364,146" fill="#bb9af7" opacity="0.8" />

  <!-- Corner Brackets -->
  <path d="M 80,104 L 80,80 L 104,80" fill="none" stroke="#7dcfff" stroke-width="3" />
  <path d="M 432,104 L 432,80 L 408,80" fill="none" stroke="#bb9af7" stroke-width="3" />
  <path d="M 80,408 L 80,432 L 104,432" fill="none" stroke="#bb9af7" stroke-width="3" />
  <path d="M 432,408 L 432,432 L 408,432" fill="none" stroke="#7dcfff" stroke-width="3" />
</svg>
